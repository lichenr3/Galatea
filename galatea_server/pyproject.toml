[project]
name = "galatea-server"
version = "0.1.0"
description = "AI Desktop Pet Backend Service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.124.4",
    "openai>=2.14.0",
    "requests>=2.32.5",
    "uvicorn[standard]>=0.38.0",
    "pydantic-settings>=2.0.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    # LangChain / LangGraph
    "langgraph>=0.2.0",
    "langchain-openai>=0.3.0",
    "langchain-postgres>=0.0.12",
    "langgraph-checkpoint-postgres>=2.0.0",
]
